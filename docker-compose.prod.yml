# Production compose file used by the CD "deploy" job (copied to the server).
# Runs the images CI pushed to Docker Hub instead of building locally.
#   DOCKERHUB_USERNAME  - Docker Hub user that owns the images
#   TAG                 - image tag to run (commit SHA; defaults to latest)
# The server must have ./backend.env next to this file (Mongo URI, JWT secret, Gemini key).

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    image: ${DOCKERHUB_USERNAME}/crackd-backend:${TAG:-latest}
    env_file: ./backend.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped          # no public port: nginx reaches it as "backend"

  frontend:
    image: ${DOCKERHUB_USERNAME}/crackd-frontend:${TAG:-latest}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
