server {
  listen 80;

  # Serve the React app
  root /usr/share/nginx/html;
  index index.html;

  # React Router: unknown paths go to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Forward API calls to the backend container (named "backend" in docker-compose)
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Needed so the streaming chat answers arrive live
    proxy_buffering off;
    proxy_read_timeout 120s;
  }
}
