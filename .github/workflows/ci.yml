name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20  
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Check
        run: npm run lint

      - name: Build Check
        run: npm run build

  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run API integration tests
        run: npm run test:api

      - name: App load check
        run: node -e "require('./src/app.js'); console.log('app.js loads fine')"

  # Runs only after both test jobs pass
  docker:
    needs: [frontend-ci, backend-ci]
    runs-on: ubuntu-latest
    env:
      # Only push images on a real push to main (not on pull requests)
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push) backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/crackd-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/crackd-backend:${{ github.sha }}

      - name: Build (and push) frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/crackd-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/crackd-frontend:${{ github.sha }}

  # Continuous deployment: runs only on pushes to main, after images are pushed.
  # Needs secrets SERVER_HOST, SERVER_USER, SERVER_SSH_KEY (skips if SERVER_HOST is unset).
  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Check deploy secrets
        id: check
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          if [ -z "$SERVER_HOST" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SERVER_HOST secret not set - skipping deploy"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Code
        if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Copy compose file to server
        if: steps.check.outputs.enabled == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: docker-compose.prod.yml
          target: crackd

      - name: Pull new images and restart
        if: steps.check.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/crackd
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export TAG=${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            # Health check: wait up to ~60s for the API to answer through nginx
            for i in $(seq 1 12); do
              if curl -fsS http://localhost/api/health > /dev/null; then
                echo "Deploy healthy (TAG=$TAG)"; exit 0
              fi
              sleep 5
            done
            echo "Health check failed"; docker compose -f docker-compose.prod.yml logs --tail=50 backend; exit 1
