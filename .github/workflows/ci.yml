name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20  
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Check
        run: npm run lint

      - name: Build Check
        run: npm run build

  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run API integration tests
        run: npm run test:api

      - name: App load check
        run: node -e "require('./src/app.js'); console.log('app.js loads fine')"

  # Runs only after both test jobs pass
  docker:
    needs: [frontend-ci, backend-ci]
    runs-on: ubuntu-latest
    env:
      # Only push images on a real push to main (not on pull requests)
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push) backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/crackd-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/crackd-backend:${{ github.sha }}

      - name: Build (and push) frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/crackd-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/crackd-frontend:${{ github.sha }}
